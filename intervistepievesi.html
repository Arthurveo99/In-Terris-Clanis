<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="logo.ico" type="image/x-icon">
  <style>

.video-container {
  position: relative;
  width: 100%;
  max-width: 900px;    /* opzionale: larghezza massima */
  margin: auto;
  padding-bottom: 56.25%; /* 16:9 */
  height: 0;
  overflow: hidden;
}
.video-container iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: 0;
}
    body {
      margin: 0;
      font-family: 'EB Garamond', serif;
      background-color: #c96c4f;
      background-image: url('sfondoclanis.jpg');
      background-size: auto;
      background-repeat: repeat;

        user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      
    }

    header {
      background-color: #004d3a;
      background-image: url('https://www.transparenttextures.com/patterns/xv.png');
      background-repeat: repeat;
      background-size: cover;
      color: #3b2f2f;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-bottom: 4px double #a67c52;
      position: relative;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 2rem;
      color: white;
      position: absolute;
      top: 1rem;
      left: 1rem;
      cursor: pointer;
      z-index: 1000;
    }

    .logo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background-image: url('logo.jpg');
      background-size: cover;
      background-position: center;
      margin-bottom: 1rem;
      border: 3px solid #a67c52;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .motto {
      font-style: italic;
      font-size: 2rem;
      color: white;
      margin-bottom: 1rem;
      font-weight: bold;
    }

    nav {
      width: 100%;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
    }

    nav a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      font-size: 2rem;
      border-bottom: 1px dotted transparent;
    }

    nav a:hover {
      text-decoration: underline;
    }

    p, li {
      font-size: 1.3rem;
      line-height: 1.7;
      font-weight: bold;
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      font-weight: bold;
    }

    h2 {
      font-size: 2rem;
      text-align: center;
      font-weight: bold;
      color: green;
    }

    h3 {
      font-size: 1.7rem;
      text-align: left;
      font-weight: bold;
      color: brown;
    }

    hr {
      background-color: red;
      border: none;
      height: 1px;
    }

    b {
      color: brown;
    }

    a {color: brown;}
    a.appr {color: green;}

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #3c3c3c;
      color: #fff;
      margin-top: 2rem;
      font-size: 1.5rem;
    }

    #intro {
      padding: 3rem 2rem;
      max-width: 1000px;
      margin: auto;
      background-color: #dcb8a1;
      color: #3b2f2f;
      
    }

    .image-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10%;
      margin-top: 2rem;
    }

    .image-gallery img {
      width: 25%;
    }

    .back-home {
      text-align: center;
      margin-top: 3rem;
    }

    .back-home a {
      padding: 1rem 2rem;
      background-color: #7a5742;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      box-shadow: 0 0 8px #0003;
      transition: background-color 0.3s ease;
    }

    .back-home a:hover {
      background-color: #5e3c2b;
    }
     img {
  display: block;
  margin-left: auto;
  margin-right: auto;
   }

    .centrato {display: flex; justify-content: center;}

    @media (max-width: 768px) {
      header {
        align-items: flex-start;
        text-align: left;
      }

      .menu-toggle {
        display: block;
      }

      .logo {
        align-self: flex-start;
        margin-top: 2rem;
        margin-left: 3rem;
        margin-bottom: 0.5rem;
      }

      nav ul {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
        display: none;
        margin-top: 1rem;
        margin-left: 3rem;
      }

      nav ul.show {
        display: flex;
      }

      .image-gallery img {
        width: 80%;
      }
    }
  </style>
</head>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const menu = document.getElementById('menu');
    toggle.addEventListener('click', () => {
      menu.classList.toggle('show');
    });


//Può impedire l'accesso veloce a "Visualizza sorgente"

document.addEventListener('contextmenu', e => e.preventDefault());

//Disabilita Ctrl+U con JavaScript:

document.addEventListener('keydown', function(e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.key === 'u') ||
        (e.ctrlKey && e.shiftKey && e.key === 'I') ||
        (e.ctrlKey && e.shiftKey && e.key === 'J')
      ) {
        e.preventDefault();
        alert("Funzione disattivata.");
      }
    });
